name: Deploy current course demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current demo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify current delivery and prepare site
        run: |
          sha256sum --check --strict SHA256SUMS
          mkdir -p _site
          cp index.html lesson-two.html version.json SHA256SUMS THIRD-PARTY-NOTICES.md .nojekyll _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload current demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
