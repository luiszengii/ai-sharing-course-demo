name: Deploy v0.1 demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout fixed demo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify unchanged v0.1 and prepare site
        run: |
          echo '3bb96eb0955604ad8cd75790398f9a159933d57d7260585bdafe41111d69e88e  index.html' | sha256sum --check --strict
          mkdir -p _site
          cp index.html version.json .nojekyll _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload fixed demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
